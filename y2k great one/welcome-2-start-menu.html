.w98{
  background:var(--win); border:2px solid var(--win-line); padding:3px; position:relative;
  box-shadow:inset 2px 2px 0 var(--win-hi), inset -2px -2px 0 var(--win-lo), 4px 5px 0 rgba(63,59,143,.28);
}
.tb{
  display:flex; align-items:center; gap:6px; padding:3px 4px 3px 6px; user-select:none; touch-action:none;
  background:linear-gradient(90deg,var(--tb1),var(--tb2)); color:#fff;
  font-family:var(--font-ui); font-size:13px; letter-spacing:.04em; text-shadow:1px 1px 0 rgba(63,59,143,.55);
}
.tb .spr{ image-rendering:pixelated; }
.tb-title{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tb-btns{ display:flex; gap:2px; }
.tb-btn{
  width:18px; height:16px; display:grid; place-items:center; padding:0; text-shadow:none; line-height:1;
  background:var(--win); color:var(--win-line); font:700 10px var(--font-ui);
  border:2px solid; border-color:var(--win-hi) var(--win-lo) var(--win-lo) var(--win-hi);
}
.tb-btn:active{ border-color:var(--win-lo) var(--win-hi) var(--win-hi) var(--win-lo); }
.sunk{ border:2px solid; border-color:var(--win-lo) var(--win-hi) var(--win-hi) var(--win-lo); }
.pbtn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:6px 16px;
  background:linear-gradient(#ffb4e2,#f478cc); color:#fff; border:2px solid var(--win-line); border-radius:14px;
  font-family:var(--font-ui); font-size:14px; text-shadow:1px 1px 0 #b0388a; box-shadow:2px 3px 0 var(--win-line);
  transition:transform .1s;
}
.pbtn:hover{ transform:translate(-1px,-1px); box-shadow:3px 4px 0 var(--win-line); }
.pbtn:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--win-line); }
.pbtn.blue{ background:linear-gradient(#b7c4ff,#8a9cf0); text-shadow:1px 1px 0 #4b4bd8; }
.pbtn.mint{ background:linear-gradient(#c9f8dc,#86dcae); color:var(--ink); text-shadow:none; }

.toast{ position:fixed; z-index:9500; left:50%; bottom:22px; transform:translate(-50%,30px); opacity:0; max-width:min(440px,92vw); padding:8px 16px; text-align:center; pointer-events:none;

/* =====================================================================
   v6 · cozy sky scene (shared by the home welcome box and the standalone welcome pages)
   ===================================================================== */
:root{
  --sk1:#9fc4ff; --sk2:#cfe0ff; --sk3:#ffe2f2; --sk4:#fff1d2; --sunc:#fffbe3;
  --cloudspr:none; --hills-b:none; --hills-f:none;
}
.lulu{ display:block; aspect-ratio:380/434; background:var(--lulu) 0 0/100% 100% no-repeat; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }


/* ---------- shared cozy sky scene ---------- */
.wscene,.sky-page{
  position:relative; container-type:inline-size; overflow:hidden; isolation:isolate;
  border:3px solid var(--win-line);
  background:
    radial-gradient(circle at 88% 10%, var(--sunc) 0 5%, rgba(255,246,210,.85) 10%, rgba(255,246,210,0) 33%),
    linear-gradient(180deg,var(--sk1) 0%,var(--sk2) 38%,var(--sk3) 72%,var(--sk4) 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.5), 4px 5px 0 rgba(63,59,143,.3);
}
.wscene::before,.sky-page::before{ content:''; position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.38; background:radial-gradient(#fff 1px,transparent 1.6px) 0 0/8px 8px; }
.wcl{ position:absolute; left:-150px; z-index:1; width:128px; height:56px; opacity:.95; pointer-events:none;
  background:var(--cloudspr) center/contain no-repeat; image-rendering:pixelated; animation:wdrift var(--dur,90s) linear var(--del,0s) infinite; }
@keyframes wdrift{ to{ transform:translateX(calc(100cqw + 320px)); } }
.wscene .wstar{ z-index:1; }
.hill{ position:absolute; left:0; right:0; bottom:0; pointer-events:none; background-repeat:no-repeat; background-size:100% 100%; image-rendering:pixelated; }
.hill.b{ height:104px; background-image:var(--hills-b); z-index:1; }
.hill.f{ height:66px; background-image:var(--hills-f); z-index:3; }

/* shared bits */
.wh{ font-family:var(--font-logo); font-weight:800; font-size:clamp(22px,4.4cqw,32px); line-height:1.12; color:#4b4bd8; text-shadow:2px 2px 0 var(--shadow-pink); margin-bottom:8px; }
.wp{ font-size:14px; line-height:1.6; color:var(--ink); }
.wp b{ color:#d6379f; }
.wjoin{ margin-top:14px; }
.wjoin-row{ display:flex; gap:8px; }
.wjoin-row input{ flex:1; min-width:0; padding:9px 12px; font:600 15px var(--font-body); color:var(--ink); background:#fff; border:2px solid; border-color:var(--win-lo) var(--win-hi) var(--win-hi) var(--win-lo); box-shadow:inset 1px 1px 0 rgba(63,59,143,.15); }
.wjoin-row input::placeholder{ color:#a99ed8; }
.wjoin .go{ padding:6px 20px; font-size:16px; white-space:nowrap; }
.wperks{ display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:8px; font-family:var(--font-ui); font-size:12.5px; color:var(--ink2); }
.join-ok{ margin-top:8px; font-weight:800; color:#1f9d63; }
.wtrust{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink2); }
.wtrust .faces{ display:flex; } .wtrust .face{ width:28px; height:24px; background-size:28px 24px; margin-left:-7px; filter:drop-shadow(1px 1px 0 rgba(63,59,143,.3)); } .wtrust .face:first-child{ margin-left:0; }
.wtrust b{ font-family:var(--font-ui); font-weight:400; font-size:15px; color:var(--link); }
.wtrust .stars{ font-size:13px; letter-spacing:1px; }
.bubble{ position:relative; display:inline-block; padding:5px 12px; background:#fffef8; border:2px solid var(--win-line); border-radius:14px; box-shadow:2px 3px 0 var(--win-line); font-family:var(--font-hand); font-weight:600; font-size:14px; color:#5b4fc0; line-height:1.3; }

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const on=(el,ev,fn,o)=>{ if(el) el.addEventListener(ev,fn,o); };

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const wide=()=>innerWidth>1180;

const HOME_URL='desktop y2k - great one v3.html', RADIO_URL='1mq-radio.html';

/* ---------- pixel-stair hills for the sky scenes ---------- */
function pixelHills(seed,w,h,base,amp,fill,flowers){
  let s=seed; const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const f1=.04+rnd()*.02, f2=.11+rnd()*.05, p1=rnd()*6, p2=rnd()*6, ys=[];
  for(let x=0;x<=w;x++) ys.push(Math.round(base+amp*Math.sin(x*f1+p1)+amp*.42*Math.sin(x*f2+p2)));
  let d='M0 '+h+' V'+ys[0]; for(let x=1;x<=w;x++) if(ys[x]!==ys[x-1]) d+=' H'+x+' V'+ys[x]; d+=' H'+w+' V'+h+' Z';
  let extra=''; const fc=['#ff9fdc','#fff29a','#ffffff','#b9a8ff'];
  for(let i=0;i<(flowers||0);i++){ const x=Math.floor(rnd()*w); extra+='<rect x="'+x+'" y="'+(ys[x]+1+Math.floor(rnd()*4))+'" width="1" height="1" fill="'+fc[i%4]+'"/>'; }
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" shape-rendering="crispEdges"><path d="'+d+'" fill="'+fill+'"/>'+extra+'</svg>';
  return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}
function paintHills(){ const r=document.documentElement; r.style.setProperty('--hills-b',pixelHills(7,160,30,12,6,'#bdeecf',0)); r.style.setProperty('--hills-f',pixelHills(31,160,20,8,5,'#8fdcae',26)); }

paintHills();

/* =====================================================================
   1MQ RADIO · shared question state  (used by the desktop widgets AND the full-screen radio)
   ===================================================================== */
const CONFIG={
  premiumUrl:'https://www.1minute.app/the-1-min-question-3-months-plan',
  fastCommentsTenantId:'',        // ← paste your FastComments tenant id here to switch the demo replies to the live widget
  freeShuffles:3,                 // extra shuffles a free visitor gets each day
  timerSeconds:60
};
/* stations: free ones are playable by everybody, ★ ones need premium */
const CHANNELS=[
  {id:'mix',  freq:88.1,  name:'all stations', tag:'the mix',         ico:'✿', free:true,  face:0, blurb:'a little of everything'},
  {id:'calm', freq:91.3,  name:'soft landing', tag:'calm',            ico:'☁', free:true,  face:1, blurb:'slow down & let go'},
  {id:'focus',freq:94.7,  name:'deep focus',   tag:'productivity',    ico:'◎', free:false, face:2, blurb:'find your one next step'},
  {id:'goals',freq:97.9,  name:'north star',   tag:'goal setting',    ico:'★', free:false, face:3, blurb:'aim the week ahead'},
  {id:'love', freq:100.3, name:'be kind',      tag:'self-love',       ico:'♡', free:false, face:4, blurb:'talk to yourself like a friend'},
  {id:'clear',freq:102.9, name:'clear skies',  tag:'problem solving', ico:'☀', free:false, face:5, blurb:'untangle the knot'},
  {id:'joy',  freq:105.1, name:'sparkle fm',   tag:'joy & gratitude', ico:'✦', free:false, face:0, blurb:'notice the good stuff'},
  {id:'brave',freq:107.5, name:'brave hearts', tag:'courage',         ico:'✧', free:false, face:1, blurb:'a little bolder today'}
];
const BANK={
  calm:[
    "What does my mind need to put down for one minute?","What would “enough” actually feel like right now?","What am I ready to let go of?",
    "Where in my body am I holding tension, and what would soften it?","What is the gentlest thing I could do for myself today?","What would it feel like to have nothing to prove right now?",
    "Which sounds, smells or textures make me feel safe?","If today had a soft landing, what would it look like?","What is one thing I can stop carrying tonight?","What is my body trying to tell me right now?"],
  focus:[
    "What is the one thing that would make everything else easier?","What’s one thing I’m avoiding that would take five minutes?","What am I making harder than it needs to be right now?",
    "If I could only finish one thing today, which one would matter most?","What is the smallest next step I can take in the next ten minutes?","What is distracting me, and what is it really pointing to?",
    "What would I do today if I trusted myself completely?","What can I say no to today so I can say yes to what matters?","What would “done” look like for this task?","Which habit is quietly stealing my best hours?"],
  goals:[
    "What do I want my life to look like a year from now?","What is one tiny action that moves me toward the goal I keep postponing?","What would future me thank me for doing this week?",
    "Which of my goals is truly mine, and which one am I borrowing?","What would I attempt if I knew I couldn’t fail?","What is my next milestone, and what is the very first step toward it?",
    "What am I building that I’ll be proud of in five years?","What is one thing I’d regret not starting?","How will I know I’m making progress this month?","What does my ideal ordinary day look like?"],
  love:[
    "What would I say to a friend who felt exactly how I feel right now?","What are three things I genuinely like about myself?","When did I last forgive myself, and what changed?",
    "What do I need to hear today?","What am I proud of that I never talk about?","How can I be a little softer with myself today?",
    "What would it feel like to fully accept myself right now?","Who would I be if I stopped worrying what people think?","What did I do well this week that I overlooked?","Which part of me needs more attention right now?"],
  clear:[
    "What’s a problem I’m treating as permanent that isn’t?","Where in my life am I waiting for permission I don’t need?","What’s the real question underneath this worry?",
    "What would my wisest self do here?","What do I already know but haven’t admitted to myself yet?","What would I do if I had all the time and money I needed?",
    "What is the smallest experiment I could run to find out?","Which “always” or “never” could become “right now”?","If this problem were a gift, what would it be teaching me?","Whose advice am I following, and does it actually fit me?"],
  joy:[
    "What’s one thing that made me smile today?","What do I have now that I once wished for?","What small pleasure can I savor in the next hour?",
    "Who made my life better this week, and have I told them?","What made me laugh the hardest lately?","What would make today feel like a win?",
    "What happy memory could I revisit right now?","Which colors, songs or places bring me instant joy?","What am I looking forward to?","What beautiful thing did I notice today?"],
  brave:[
    "What would I do if I were 10% braver?","What is my heart nudging me to try?","Which fear is actually excitement in disguise?",
    "What conversation have I been avoiding?","What’s one small brave thing I can do before lunch?","What would I start today if nobody was watching?",
    "Where am I playing smaller than I really am?","What did I get through that I once thought I couldn’t?","What am I ready to say out loud?","What would courage look like on an ordinary Tuesday?"]
};
const QALL=[]; Object.keys(BANK).forEach(ch=>BANK[ch].forEach((t,i)=>QALL.push({id:ch+'-'+i,ch,text:t})));
const QBYID={}; QALL.forEach(q=>QBYID[q.id]=q);
const poolOf=ch=>ch==='mix'?QALL:QALL.filter(q=>q.ch===ch);

const Q=(()=>{
  const KEY='1mq.radio.v1', subs=[];
  let S={ch:'mix',scene:'clouds',sound:'chimes',soundOn:false,vol:.45,match:true,font:'rounded',size:1,gap:'off',autohide:true,premium:false,
    bookmarks:[],collections:['favorites'],bmcol:{},reflections:[],intention:'',days:[],day:'',cur:{},shuffles:0,used:[],replies:{}};
  try{ const o=JSON.parse(localStorage.getItem(KEY)||'null'); if(o&&typeof o==='object') S=Object.assign(S,o); }catch(e){}
  const pad=n=>String(n).padStart(2,'0');
  const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const todayStr=()=>dstr(new Date());
  const hash=s=>{ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; };
  const chan=id=>CHANNELS.find(c=>c.id===(id||S.ch))||CHANNELS[0];
  const allowed=id=>S.premium||chan(id).free;
  /* everyone gets the same "question of the day" per station, so replies pile up on the same question */
  const daily=ch=>{ const p=poolOf(ch); return p[hash(todayStr()+'|'+ch)%p.length]; };
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  function emit(w){ subs.forEach(f=>{ try{ f(w); }catch(e){ console.error('[Q]',e); } }); }
  function rollover(){ const t=todayStr(); if(S.day!==t){ S.day=t; S.cur={}; S.shuffles=0; S.used=[]; save(); } }
  function current(){ rollover(); const ch=S.ch; if(!S.cur[ch]||!QBYID[S.cur[ch]]) S.cur[ch]=daily(ch).id; return QBYID[S.cur[ch]]; }
  function left(){ rollover(); return S.premium?Infinity:Math.max(0,CONFIG.freeShuffles-S.shuffles); }
  function shuffle(o){                         // o.free → auto-advance, doesn't spend a shuffle
    rollover(); const spend=!S.premium&&!(o&&o.free); if(spend&&left()<=0) return null;
    const pool=poolOf(S.ch), cur=current(); if(S.used.indexOf(cur.id)<0) S.used.push(cur.id);
    let cand=pool.filter(q=>S.used.indexOf(q.id)<0); if(!cand.length){ S.used=[cur.id]; cand=pool.filter(q=>q.id!==cur.id); }
    const q=cand[Math.floor(Math.random()*cand.length)]; S.cur[S.ch]=q.id; S.used.push(q.id); if(spend) S.shuffles++;
    save(); emit('question'); return q;
  }
  function setChannel(id){ if(!allowed(id)) return false; S.ch=id; save(); emit('channel'); emit('question'); return true; }
  function step(dir){                           // next/previous station the visitor is allowed to play
    const list=CHANNELS.filter(c=>allowed(c.id)), i=list.findIndex(c=>c.id===S.ch); return setChannel(list[(i+dir+list.length)%list.length].id);
  }
  function msToMidnight(){ const n=new Date(), m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1); return m-n; }
  function streak(){
    const set=new Set(S.days); let d=new Date(), n=0; if(!set.has(dstr(d))) d.setDate(d.getDate()-1);
    while(set.has(dstr(d))){ n++; d.setDate(d.getDate()-1); } return n;
  }
  function markDone(){ const t=todayStr(); if(S.days.indexOf(t)<0){ S.days.push(t); S.days=S.days.slice(-400); save(); } emit('streak'); }
  addEventListener('storage',e=>{ if(e.key!==KEY||!e.newValue) return; try{ Object.assign(S,JSON.parse(e.newValue)); }catch(_){ return; } emit('plan'); emit('question'); });   /* the home page and the radio tab stay in sync */
  return { S, save, emit, on:f=>subs.push(f), chan, allowed, current, daily, left, shuffle, setChannel, step, msToMidnight, streak, markDone, todayStr,
    setPremium(v){ S.premium=!!v; save(); emit('plan'); } };
})();

$$('.joinForm').forEach(f=>on(f,'submit',e=>{ e.preventDefault(); const em=$('input[type=email]',f); if(!em.value.trim()||!em.checkValidity()){ em.reportValidity(); return; } const ok=$('.join-ok',f); if(ok) ok.hidden=false; em.value=''; }));
$$('[data-tab]').forEach(b=>on(b,'click',()=>{ location.href=HOME_URL+'#'+b.dataset.tab; }));
$$('[data-fs]').forEach(b=>on(b,'click',e=>{ e.preventDefault(); window.open(RADIO_URL+(b.dataset.fs==='play'?'?play=1':''),'_blank'); }));

})();
</script>
